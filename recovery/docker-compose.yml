services:

  ss-database:
    image: postgres:15
    container_name: ss-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./database/data:/var/lib/postgresql/data
    networks:
      - api-to-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ss-api:
    build: .
    container_name: ss-api

    env_file:
      - .env

    ports:
      - "${API_PORT}:8080"

    volumes:
      - ./src:/api/src

    working_dir: /api

    user: "0:0"

    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp:unconfined

    depends_on:
      - ss-database

    networks:
      - api-to-database

networks:
  api-to-database:
    driver: bridge